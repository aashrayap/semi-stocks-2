name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python canonical/40-engine/site_data.py --validate
      - run: uv run python canonical/40-engine/tests/test_signal_desk_contract.py
